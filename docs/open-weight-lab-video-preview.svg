<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/></marker></defs><rect width="1600" height="1120" fill="white"/><style>text{font-family:"Comic Sans MS","Bradley Hand",sans-serif}</style><text x="55" y="76.0" font-size="40" fill="#1e1e1e" text-anchor="start" font-weight="bold">How our Open Weight Lab works</text><text x="55" y="130.0" font-size="24" fill="#495057" text-anchor="start" font-weight="normal">Teach a model → prove what changed → use it in a real voice agent</text><line x1="55" y1="150" x2="975" y2="150" stroke="#087f5b" stroke-width="3"/><rect x="65" y="205" width="320" height="205" rx="24" fill="#e6fcf5" stroke="#087f5b" stroke-width="3"/><text x="225" y="260.0" font-size="28" fill="#087f5b" text-anchor="middle" font-weight="bold">1  Business facts</text><text x="225" y="305.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Wren opening hours</text><text x="225" y="331.25" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Gift card rules</text><text x="225" y="357.5" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">A few clear examples</text><text x="225" y="390.0" font-size="17" fill="#087f5b" text-anchor="middle" font-weight="normal">Your private know-how</text><rect x="515" y="205" width="320" height="205" rx="24" fill="#f3f0ff" stroke="#7048e8" stroke-width="3"/><text x="675" y="260.0" font-size="28" fill="#7048e8" text-anchor="middle" font-weight="bold">2  Train an adapter</text><text x="675" y="305.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Inkling Small learns</text><text x="675" y="331.25" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">the examples by adjusting</text><text x="675" y="357.5" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">a small set of weights</text><text x="675" y="390.0" font-size="17" fill="#7048e8" text-anchor="middle" font-weight="normal">Training runs on Tinker</text><rect x="965" y="205" width="320" height="205" rx="24" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/><text x="1125" y="260.0" font-size="28" fill="#1971c2" text-anchor="middle" font-weight="bold">3  Save checkpoint</text><text x="1125" y="305.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Reusable trained adapter</text><text x="1125" y="331.25" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Version + unique hash</text><text x="1125" y="357.5" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Training evidence</text><text x="1125" y="390.0" font-size="17" fill="#1971c2" text-anchor="middle" font-weight="normal">This is the model artifact</text><path d="M390 308 L505 308" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><text x="447.5" y="294.0" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Examples</text><path d="M840 308 L955 308" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><text x="897.5" y="294.0" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="normal">New weights</text><rect x="240" y="500" width="1120" height="270" rx="30" fill="#faf9ff" stroke="#7048e8" stroke-width="4"/><text x="275" y="552.0" font-size="30" fill="#7048e8" text-anchor="start" font-weight="bold">4  Open Weight Lab</text><text x="1320" y="552.0" font-size="20" fill="#495057" text-anchor="end" font-weight="normal">Same question. Same settings. Different weights.</text><rect x="285" y="580" width="290" height="135" rx="20" fill="#f8f9fa" stroke="#495057" stroke-width="3"/><text x="430.0" y="615.0" font-size="19" fill="#495057" text-anchor="middle" font-weight="bold">BASE MODEL</text><text x="430.0" y="654.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">“I don’t know Wren’s</text><text x="430.0" y="679.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">opening hours.”</text><rect x="655" y="580" width="330" height="135" rx="20" fill="#e6fcf5" stroke="#087f5b" stroke-width="3"/><text x="820.0" y="615.0" font-size="19" fill="#087f5b" text-anchor="middle" font-weight="bold">TRAINED ADAPTER</text><text x="820.0" y="654.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">“11:30 a.m.–10 p.m.</text><text x="820.0" y="679.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Tuesday–Sunday…”</text><rect x="1065" y="580" width="250" height="135" rx="20" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><text x="1190.0" y="615.0" font-size="19" fill="#e8590c" text-anchor="middle" font-weight="bold">PROOF</text><text x="1190.0" y="654.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Accuracy • latency</text><text x="1190.0" y="679.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="normal">cost • exact output</text><path d="M585 648 L645 648" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><path d="M995 648 L1055 648" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1125 415 L1125 490" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 9"/><text x="1125.0" y="438.5" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="normal">Load checkpoint</text><rect x="80" y="865" width="255" height="140" rx="24" fill="#e6fcf5" stroke="#087f5b" stroke-width="3"/><text x="207.5" y="905.0" font-size="23" fill="#087f5b" text-anchor="middle" font-weight="bold">Customer asks</text><text x="207.5" y="946.0" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">“What are Wren’s</text><text x="207.5" y="969.75" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">opening hours?”</text><rect x="855" y="865" width="280" height="140" rx="24" fill="#f3f0ff" stroke="#7048e8" stroke-width="3"/><text x="995.0" y="905.0" font-size="23" fill="#7048e8" text-anchor="middle" font-weight="bold">Trained answer</text><text x="995.0" y="946.0" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Generated directly from</text><text x="995.0" y="969.75" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">the saved checkpoint</text><rect x="1240" y="865" width="280" height="140" rx="24" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><text x="1380.0" y="905.0" font-size="23" fill="#e8590c" text-anchor="middle" font-weight="bold">Spoken response</text><text x="1380.0" y="946.0" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Same voice experience</text><text x="1380.0" y="969.75" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Different model source</text><rect x="430" y="835" width="310" height="200" rx="25" fill="#fff9db" stroke="#1e1e1e" stroke-width="3"/><text x="585" y="885.0" font-size="27" fill="#1e1e1e" text-anchor="middle" font-weight="bold">Voice Agent</text><text x="585" y="925.0" font-size="18" fill="#495057" text-anchor="middle" font-weight="normal">Choose answer source</text><rect x="470" y="952" width="95" height="45" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="518" y="981.0" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="normal">RAG</text><rect x="583" y="952" width="120" height="45" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/><text x="643" y="981.0" font-size="18" fill="#087f5b" text-anchor="middle" font-weight="normal">Adapter</text><path d="M340 935 L420 935" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 935 L845 935" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><text x="797.5" y="921.0" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Selected route</text><path d="M1145 935 L1230 935" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1095 775 L675 825" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 9"/><text x="885.0" y="786.0" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="normal">Checkpoint available to agent</text><text x="800" y="1080.0" font-size="21" fill="#495057" text-anchor="middle" font-weight="normal">Vercel runs the app and records the experiment.  Tinker trains and serves the adapter.</text></svg>